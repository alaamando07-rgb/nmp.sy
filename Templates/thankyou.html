<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم تسجيل الرد - مستودعات ناهد المنجد</title>
    <!-- استدعاء خط تجوال Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0ebf8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            text-align: center;
            border-top: 8px solid #5d2e86;
        }
        .logo-title {
            color: #5d2e86;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .sub-text {
            color: #555;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .welcome-box {
            font-size: 18px;
            font-weight: 700;
            color: #111;
            margin: 20px 0;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 15px 0;
        }
        .msg {
            color: #333;
            font-size: 16px;
            font-weight: 500;
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-title">مستودعات ناهد المنجد للأدوية</div>
        <div class="sub-text">يسرنا دعوة سيادتكم لحضور الفعالية</div>
        
        <div class="welcome-box">
            أهلاً بك
        </div>

        <div class="msg">
            {% if already_voted %}
                لقد قمت مسبقاً بتسجيل ردك. شكراً لك!
            {% else %}
                تم تسجيل ردك بنجاح، شكراً لاختيارك وتأكيد حضورك!
            {% endif %}
        </div>
    </div>

</body>
</html>
