<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصيدلاني {{ guest.name }} - دعوة حضور الفعالية</title>
    <!-- استدعاء خط تجوال Tajawal -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f0ebf8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border-top: 10px solid #5d2e86;
        }
        .header-banner {
            background: #ffffff;
            padding: 0px 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .header-banner img {
            width: 250px;
            height: auto;
            display: block;
            margin: 0 auto;
            padding: 0;
        }
        .content {
            padding: 30px;
        }
        h1 {
            color: #2b124c;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .invitation-text {
            color: #222222;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 25px;
        }
        .details-box {
            background: #faf9fc;
            border-right: 4px solid #5d2e86;
            padding: 15px 20px;
            margin-bottom: 30px;
            border-radius: 4px;
        }
        .details-box p {
            margin: 8px 0;
            color: #333;
            font-size: 15px;
            font-weight: 500;
        }
        .form-section {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 25px;
        }
        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: #111;
            margin-bottom: 20px;
            border-bottom: 2px solid #5d2e86;
            padding-bottom: 8px;
            display: inline-block;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 17px;
            color: #222;
            cursor: pointer;
            font-weight: 500;
        }
        .radio-label input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #5d2e86;
            cursor: pointer;
        }
        .submit-btn {
            background-color: #5d2e86;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Tajawal', sans-serif;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #482268;
        }
        /* تنسيق التذييل الجديد (Footer) */
        .page-footer {
            text-align: center;
            padding: 15px 20px;
            background-color: #faf9fc;
            border-top: 1px solid #eae6f2;
            font-size: 13px;
            color: #666;
        }
        .page-footer a {
            color: #5d2e86;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s;
        }
        .page-footer a:hover {
            color: #482268;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هيدر اللوغو تماماً كما في التصميم الأصلي -->
        <div class="header-banner">
            <img src="{{ url_for('static', filename='nmp_logo.png') }}" alt="مستودعات الدكتورة ناهد المنجد">
        </div>

        <div class="content">
            <h1>فعالية بثقتكم نكبر لمستودعات الدكتورة ناهد المنجد</h1>
            
            <div class="invitation-text">
                {{ guest.name }} ندعوكم لحضور فعالية بثقتكم نكبر لمستودعات الدكتورة ناهد المنجد
            </div>

            <div class="details-box">
                <p><strong>المكان:</strong> حمص نادي الأطباء والمهندسين</p>
                <p><strong>التاريخ:</strong> يوم الاثنين 24/8/2026</p>
                <p><strong>الوقت:</strong> الساعة 3:00 ظهراً</p>
            </div>

            <form action="/submit" method="POST" class="form-section">
                <!-- إرسال التوكن مع الطلب -->
                <input type="hidden" name="token" value="{{ guest.token }}">
                
                <div class="form-title">حضوركم يشرفنا</div>
                
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="سأحضر" required>
                        سأحضر
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="attendance" value="أعتذر عن الحضور">
                        أعتذر عن الحضور
                    </label>
                </div>

                <button type="submit" class="submit-btn">إرسال</button>
            </form>
        </div>

        <!-- التذييل الإضافي الصغير والمرتب -->
        <div class="page-footer">
            بالتعاون مع تطبيق تسوق | <a href="https://play.google.com/store/apps/details?id=com.newtasouk.app" target="_blank">رابط الموقع الرسمي</a>
        </div>
    </div>

</body>
</html>
