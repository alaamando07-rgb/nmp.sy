<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل بيانات الضيف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #f4f1fa;
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border-top: 6px solid #5d2e86;
        }
        h2 {
            color: #2b124c;
            margin-bottom: 25px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #5d2e86;
        }
        .save-btn {
            background-color: #5d2e86;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-family: 'Tajawal', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            transition: background 0.2s;
        }
        .save-btn:hover {
            background-color: #431f63;
        }
        .back-link {
            display: block;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>تعديل بيانات الصيدلاني</h2>
        <form action="/update" method="POST">
            <input type="hidden" name="token" value="{{ guest.token }}">
            <input type="text" name="name" value="{{ guest.name }}" required>
            <button type="submit" class="save-btn">حفظ التعديلات</button>
        </form>
        <a href="/" class="back-link">إلغاء والعودة للوحة التحكم</a>
    </div>

</body>
</html>
